[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenant-provisioning-control-plane"
version = "0.1.0"
description = "A local-first asynchronous tenant provisioning control plane."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.110,<1",
    "pika>=1.3,<2",
    "psycopg[binary]>=3.1,<4",
    "pydantic-settings>=2.2,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.7,<2",
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "ruff>=0.4,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires a configured local PostgreSQL test database",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
